---

name: "Linting"
on:
  - push

jobs:
  lint-backend:
    name: "Lint backend"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:

      - name: "Checkout the repository"
        uses: actions/checkout@v4

      - name: "Install OS dependencies"
        run: |
          sudo apt-get update
          sudo apt-get install -y --fix-missing pkg-config

      - name: "Install uv"
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: "Set up Python"
        run: uv python install

      - name: "Install the project"
        run: uv sync --locked --all-extras --dev

      - name: "Run Black"
        run: uv run black --quiet --check website

      - name: "Run flake8"
        run: >-
          uv run
          flake8
          --exclude="migrations,website/drankspel/settings/*.py"
          --max-line-length=119
          website

  frontend-lint:
    name: "Lint frontend"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: "Checkout the repository"
        uses: actions/checkout@v4

      - name: "Set up Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: "Install frontend dependencies"
        run: npm ci

      - name: "Run lint"
        run: npm run lint

      - name: "Run format"
        run: npm run format

      - name: "Run type-check"
        run: npm run type-check
